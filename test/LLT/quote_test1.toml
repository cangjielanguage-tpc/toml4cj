depend-corns=["idea-platform"]
[envs]
HDC_SERVER_PORT="65037"
HVIGOR_USER_HOME="#{corn_cache}/hvigor"
DEVECO_CANGJIE_PATH="#{corn_dir}/#{corn_name}"
APPDATA="#{profile}/AppData/Roaming"
[vars]
"idea_basepath:ospth()"="#{corn_dir}/#{corn_name}"
"idea_configpath:ospth()"="#{corn_home}/#{corn_name}"
"idea_cachepath:ospth()"="#{corn_cache}/#{corn_name}"
"idea_classpath:rp(\n=)"="""
#{idea.core.dir}/lib/platform-loader.jar
;#{idea.core.dir}/lib/util-8.jar
;#{idea.core.dir}/lib/lib.jar
;#{idea.core.dir}/lib/rd.jar
;#{idea.core.dir}/lib/bouncy-castle.jar
;#{idea.core.dir}/lib/annotations.jar
;#{idea.core.dir}/lib/grpc.jar
;#{idea.core.dir}/lib/hwlib.jar
;#{idea.core.dir}/lib/idea_rt.jar
;#{idea.core.dir}/lib/intellij-coverage-agent-1.0.738.jar
;#{idea.core.dir}/lib/junit4.jar
"""
idea_vmoptions="""
-Xms128m
,-Xmx1536m
,-XX:ReservedCodeCacheSize=512m
,-Dfile.encoding=UTF-8
,-XX:+UseG1GC
,-XX:SoftRefLRUPolicyMSPerMB=50
,-XX:CICompilerCount=2
,-XX:+HeapDumpOnOutOfMemoryError
,-XX:-OmitStackTraceInFastThrow
,-XX:+IgnoreUnrecognizedVMOptions
,-ea
,-Dsun.io.useCanonCaches=false
,-Dsun.java2d.metal=true
,-Dsun.java2d.metal.displaySync=false
,-Djbr.catch.SIGABRT=true
,-Djdk.http.auth.tunneling.disabledSchemes=""
,-Djdk.attach.allowAttachSelf=true
,-Djdk.module.illegalAccess.silent=true
,-Dkotlinx.coroutines.debug=off
"""
other_arg="""
-Djna.boot.library.path=#{idea.core.dir}/lib/jna/amd64
,-Dpty4j.preferred.native.folder=#{idea.core.dir}/lib/pty4j
,-Djna.nosys=true
,-Djna.noclasspath=true
,-Daether.connector.resumeDownloads=false
"""

[exec]
exec="#{app_exec}"
with-no-wait=true
args=[
  "-XX:CompileCommand=exclude,com/intellij/openapi/vfs/impl/FilePartNodeRoot,trieDescend"
]
[exec.arg-str]
src="""
#{app_arg}
,#{other_arg}
,#{app_final_arg}
"""
split-str=","
replaces=["\n",""]